name: Build APK & iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/ngungtu-stem.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngungtu-apk
          path: dist/ngungtu-stem.apk

  ios-no-codesign:
    name: iOS (no codesign)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Pack Runner.app
        run: |
          mkdir -p dist payload
          cp -r build/ios/iphoneos/Runner.app payload/
          cd payload
          zip -r ../dist/ngungtu-ios-unsigned.zip Runner.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngungtu-ios-unsigned
          path: dist/ngungtu-ios-unsigned.zip

  release:
    name: GitHub Release
    needs: [android-apk, ios-no-codesign]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ngungtu-apk
          path: dist

      - name: Download iOS
        uses: actions/download-artifact@v4
        with:
          name: ngungtu-ios-unsigned
          path: dist

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ngưng Tụ STEM v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/ngungtu-stem.apk
            dist/ngungtu-ios-unsigned.zip
          body: |
            ## Tải app
            - **Android:** `ngungtu-stem.apk` — cài trực tiếp trên điện thoại
            - **iOS:** `ngungtu-ios-unsigned.zip` — bản chưa ký certificate (chỉ dùng kiểm thử CI)

            ## STEM ESP32
            App kết nối MQTT chipId `789` — máy ngưng tụ hơi nước.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
