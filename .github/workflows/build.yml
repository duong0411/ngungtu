name: Build APK & iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ngungtu-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios-no-codesign:
    name: iOS (no codesign)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Pack Runner.app
        run: |
          mkdir -p payload
          cp -r build/ios/iphoneos/Runner.app payload/
          cd payload
          zip -r ../ngungtu-ios-unsigned.zip Runner.app
          cd ..

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngungtu-ios-unsigned
          path: ngungtu-ios-unsigned.zip
