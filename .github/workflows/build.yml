name: Build APK & IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/ngungtu-stem.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngungtu-apk
          path: dist/ngungtu-stem.apk

  ios-ipa:
    name: iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # IPA chưa codesign (CI không có Apple certificate).
      # Cài lên máy thật vẫn cần ký bằng Xcode / Apple Developer.
      - name: Build IPA (no codesign)
        run: flutter build ipa --release --no-codesign

      - name: Prepare IPA
        run: |
          mkdir -p dist
          # flutter build ipa --no-codesign thường ra build/ios/ipa/*.ipa
          IPA_FILE=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -n 1 || true)
          if [ -n "$IPA_FILE" ]; then
            cp "$IPA_FILE" dist/ngungtu-stem.ipa
          else
            # Fallback: đóng gói Runner.app thành IPA chuẩn (Payload/)
            APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
            if [ -z "$APP_PATH" ]; then
              echo "Runner.app not found"
              find build/ios -maxdepth 4 -type d -print
              exit 1
            fi
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r dist/ngungtu-stem.ipa Payload
          fi
          ls -lh dist/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngungtu-ipa
          path: dist/ngungtu-stem.ipa

  release:
    name: GitHub Release
    needs: [android-apk, ios-ipa]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ngungtu-apk
          path: dist

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: ngungtu-ipa
          path: dist

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ngưng Tụ STEM v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/ngungtu-stem.apk
            dist/ngungtu-stem.ipa
          body: |
            ## Tải app
            - **Android APK:** `ngungtu-stem.apk` — cài trực tiếp trên điện thoại
            - **iOS IPA:** `ngungtu-stem.ipa` — bản CI chưa codesign (cần ký bằng Apple Developer / Xcode trước khi cài máy thật)

            ## STEM ESP32
            App kết nối MQTT chipId `789` — máy ngưng tụ hơi nước.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
